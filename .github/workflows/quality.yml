name: Project quality gates
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and research test dependencies
        run: |
          python -m pip install -r backend/requirements.txt pytest httpx
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install opencv-python-headless
      - name: Test backend and optional research tests
        run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: TypeScript and Vite production build
        run: npm run build
        working-directory: frontend
